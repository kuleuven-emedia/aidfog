############
# Audio-only smoke test config.
# Runs just the AudioProducer so we can validate FFmpeg + Rode capture
# without needing torch, the IMU replay dataset, or the earbuds.
############

host_ip: "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : True

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : "./resources/audio_codec.yml"


producer_specs:
  - package: "aidfog_audio"
    class: "AudioProducer"
    settings:
      ffmpeg_backend: "dshow"
      device_name: "Microphone (RODE NT-USB)"
      sampling_rate_hz: 48000
      num_channels: 1
      chunk_size: 1024


consumer_specs: []
pipeline_specs: []
