host_ip: "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : True     # Windows Rode mic capture

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : "./resources/audio_codec.yml"


producer_specs:
  - package: "aidfog_replay"
    class: "ImuReplayProducer"
    settings:
      imu_root: "./data/imu"             # folder with subject subfolders containing .npy IMU files
      annot_root: "./data/annotation"      # folder with subject subfolders containing .npy label files
      sampling_rate_hz: 60               # target rate (data is resampled from 64 Hz)
      original_rate_hz: 64               # raw dataset rate
      sensor_indices: [0, 5, 6, 2, 3]   # select 5 sensors from raw layout
      loop: true

  - package: "aidfog_audio"
    class: "AudioProducer"
    settings:
      ffmpeg_backend: "dshow"
      device_name: "Microphone (RODE NT-USB)"
      sampling_rate_hz: 48000
      num_channels: 1
      chunk_size: 1024


consumer_specs: []


pipeline_specs:
  - package: "aidfog_ai"
    class: "TorchPipeline"
    settings:
      model_path: "./resources/tcn_model_60fps.pth"
      input_size: [5, 6]
      output_classes: ["no_fog", "fog"]
      sampling_rate_hz: 60
      stream_in_specs:
        - package: "aidfog_replay"
          class: "ImuReplayProducer"
          settings:
            sampling_rate_hz: 60

  - package: "aidfog"
    class: "BudsPipeline"
    settings:
      stream_out_spec:
        buds:
          device_name: "D&D TECH"
          device_mapping:
            right: "12:34:56:C2:A2:30"
            left:  "12:34:56:C2:A2:31"
          sampling_rate_hz: 100
          threshold_high: 0.7
          threshold_low: 0.3
          dt: 0.01
      stream_in_specs:
        - package: "aidfog_ai"
          class: "TorchPipeline"
          settings:
            sampling_rate_hz: 60
