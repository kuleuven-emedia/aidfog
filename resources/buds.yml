host_ip: "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : False

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : null


producer_specs:
  - package: "aidfog_replay"
    class: "ImuReplayProducer"
    settings:
      dataset_path: "./data/dataset.hdf5"
      sampling_rate_hz: 60
      loop: true


consumer_specs: []


pipeline_specs:
  - package: "aidfog_ai"
    class: "TorchPipeline"
    settings:
      model_path: "./resources/tcn_model_60fps.pth"
      input_size: [5, 6]
      output_classes: ["no_fog", "fog"]
      sampling_rate_hz: 60
      stream_in_specs:
        - package: "aidfog_replay"
          class: "ImuReplayProducer"
          settings:
            sampling_rate_hz: 60

  - package: "aidfog"
    class: "BudsPipeline"
    settings:
      stream_out_spec:
        buds:
          device_name: "D&D TECH"
          address: null          # set to MAC address string to skip BLE scan, e.g. "12:34:56:C2:A2:30"
          sampling_rate_hz: 100
          threshold_high: 0.7   # fog_prob above this triggers a cue
          threshold_low: 0.3    # fog_prob below this stops the cue
          dt: 0.01
      stream_in_specs:
        - package: "aidfog_ai"
          class: "TorchPipeline"
          settings:
            sampling_rate_hz: 60
