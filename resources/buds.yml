host_ip: "127.0.0.1"
is_master_broker: True

remote_subscriber_ips: []
remote_publisher_ips: []
connections: []

is_remote_kill: False
remote_kill_ip: null


logging_spec:
  stream_period_s     : 30

  stream_hdf5         : True
  stream_csv          : False
  stream_video        : False
  stream_audio        : True     # Windows Rode mic capture

  dump_csv            : False
  dump_hdf5           : False
  dump_video          : False
  dump_audio          : False

video_codec_config_filepath : null
audio_codec_config_filepath : "./resources/audio_codec.yml"


producer_specs:
  - package: "aidfog_replay"
    class: "ImuReplayProducer"
    settings:
      imu_root: "./data/imu"             # folder with subject subfolders containing .npy IMU files
      annot_root: "./data/annotation"      # folder with subject subfolders containing .npy label files
      sampling_rate_hz: 60               # target rate (data is resampled from 64 Hz)
      original_rate_hz: 64               # raw dataset rate
      sensor_indices: [0, 5, 6, 2, 3]   # select 5 sensors from raw layout
      loop: true

  - package: "aidfog_audio"
    class: "AudioProducer"
    settings:
      ffmpeg_backend: "dshow"
      device_name: "Microphone (RODE NT-USB)"
      sampling_rate_hz: 48000
      num_channels: 1
      chunk_size: 1024


consumer_specs: []


pipeline_specs:
  - package: "aidfog_ai"
    class: "TorchPipeline"
    settings:
      # Alex's LOSOCV weights live at hermes/aidfog_ai/model_alex/weights/subject{id}.pt.
      # Available subject IDs: 001, 004, 007, 009, 010, 011, 013, 015, 029, 030.
      # The chosen ID MUST match the subject being replayed (LOSOCV: this model
      # was trained with that subject held out, so it is the only valid one for
      # evaluating that subject).
      subject_id: "001"
      enter_thresh: 20      # consecutive 1s for HysteresisFilter to enter FoG (Alex's default)
      exit_thresh: 5        # consecutive 0s to exit FoG (Alex's default)
      thresh: 0.5           # sigmoid → binary threshold (Alex's default)
      input_size: [5, 6]
      output_classes: ["no_fog", "fog"]
      sampling_rate_hz: 60
      stream_in_specs:
        - package: "aidfog_replay"
          class: "ImuReplayProducer"
          settings:
            sampling_rate_hz: 60

  - package: "aidfog"
    class: "BudsPipeline"
    settings:
      stream_out_spec:
        buds:
          device_name: "D&D TECH"
          device_mapping:
            right: "12:34:56:C2:A2:30"
            left:  "12:34:56:C2:A2:31"
          sampling_rate_hz: 100
          dt: 0.5            # BudsHandler status poll period (seconds); 100Hz polling destabilised BLE on Windows
          cueing_control:    # 4-state FSM consuming Alex's binary stream; see utils/types.py:CueingControlConfig
            entry_consec: 1                # 1 frame with binary==1 enters CUEING (Alex's HysteresisFilter already debounces upstream)
            cueing_tail_frames: 30         # ~500 ms @ 60 Hz — hold cue through mid-episode dips before releasing (CUEING_TAIL state)
            refractory_frames: 60          # ~1 s @ 60 Hz — lock out re-trigger after episode ends (REFRACTORY state, DeFOG terminology)
      stream_in_specs:
        - package: "aidfog_ai"
          class: "TorchPipeline"
          settings:
            # TorchStream needs both `classes` and `sampling_rate_hz` — must match
            # the values in the TorchPipeline producer block above, or BudsPipeline
            # will fail silently at startup on Windows spawn (TypeError is swallowed).
            classes: ["no_fog", "fog"]
            sampling_rate_hz: 60
