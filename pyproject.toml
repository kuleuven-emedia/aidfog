[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pysio-hermes-aidfog"
version = "0.0.1"
requires-python = ">=3.7"
authors = [
  { name="Maxim Yudayev", email="maxim.yudayev@gmail.com" },
  { name="e-Media Research Lab @ KU Leuven" },
]
description = "A Pine Buds Pro HERMES audio cueing system for Parkinson's"
keywords = ["embedded ai", "wearables", "sensors", "closed-loop", "pytorch", "streaming", "realtime processing", "physiology"]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: System :: Distributed Computing"
]
dependencies = [
  "pysio-hermes",
  "torch",
  "pytorch-tcn",
  "scipy",
]

[project.urls]
Homepage = "https://maximyudayev.github.io/hermes"
Documentation = "https://maximyudayev.github.io/hermes"
Repository = "https://github.com/kuleuven-emedia/aidfog.git"
Issues = "https://github.com/kuleuven-emedia/aidfog"
Changelog = "https://github.com/kuleuven-emedia/aidfog/blob/main/CHANGELOG.md"
